name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Find Project and Build
      run: |
        # البحث عن ملف build.gradle.kts أو build.gradle للوصول لمجلد المشروع
        PROJ_DIR=$(dirname $(find . -maxdepth 3 -name "settings.gradle*" -o -name "build.gradle*" | head -n 1))
        echo "Project directory found at: $PROJ_DIR"
        cd "$PROJ_DIR"
        gradle wrapper
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
        
