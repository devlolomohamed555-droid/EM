name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Unzip and Move Files
      run: |
        unzip -o em-gradle.zip
        # البحث عن مكان build.gradle ونقل جميع ملفات المشروع للجذر
        TARGET_DIR=$(dirname $(find . -mindepth 2 -name "build.gradle*" | head -n 1))
        if [ -n "$TARGET_DIR" ]; then
          cp -r $TARGET_DIR/* .
        fi

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate Wrapper and Build
      run: |
        gradle wrapper
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
        
