My Daddy:
name: Build Android APK

on: [push]

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout code
uses: actions/checkout@v4

- name: Set up JDK 17
uses: actions/setup-java@v4
with:
distribution: 'temurin'
java-version: '17'

- name: Find and Build APK
run: |
# البحث التلقائي عن ملف gradlew وتشغيله بناءً على مكانه
GRADLEW_PATH=$(find . -name "gradlew" -type f)
if [ -z "$GRADLEW_PATH" ]; then
echo "Error: gradlew not found!"
exit 1
fi
PROJECT_DIR=$(dirname "$GRADLEW_PATH")
echo "Found project at: $PROJECT_DIR"
cd "$PROJECT_DIR"
chmod +x gradlew
./gradlew assembleDebug

- name: Upload APK Artifact
uses: actions/upload-artifact@v4
with:
name: app-debug
path: '**/build/outputs/apk/debug/app-debug.apk'
