name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Unzip Project
      run: |
        # فك ضغط أي ملف مضغوط موجود سواء zip أو apk
        find . -maxdepth 2 \( -name "*.zip" -o -name "*.apk" \) -exec unzip -o {} \; || true
        
        # البحث عن مجلد app ونقله للجذر الرئيسي إذا كان بداخل مجلد فرعي
        APP_DIR=$(find . -mindepth 2 -type d -name "app" | head -n 1)
        if [ -n "$APP_DIR" ]; then
          echo "Found app directory at $APP_DIR, moving to root..."
          cp -r $APP_DIR .
        fi

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate Wrapper and Build
      run: |
        gradle wrapper
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
        
